[project]
name = "aspose-words-foss"
version = "26.5.0"
description = "Lightweight free open-source alternative to Aspose.Words — convert DOCX, DOC, RTF to Markdown, text, and PDF"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Aspose"}
]

requires-python = ">=3.10,<3.13"
dependencies = [
    "olefile>=0.46",
    "fpdf2>=2.7.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "Pillow>=10.0.0",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aspose"]
